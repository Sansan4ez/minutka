services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      # S3 endpoint and console are host-local; never expose personal vault data publicly.
      # Host ports are shifted off the assistant's 9000/9001 so both local stacks run at once.
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9003:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minutka-minio-data:/data
    healthcheck:
      # The server image exposes this built-in readiness endpoint; unlike `mc`,
      # it requires neither a client binary nor an alias configuration.
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-05-21T01-59-54Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-minutka}
    volumes:
      - ./docker/minio/init.sh:/usr/local/bin/init-minio:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/init-minio"]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      # Keep PostgreSQL private to this host; do not expose it on 0.0.0.0.
      # Host port is shifted off the assistant's 5432 so both local stacks run at once.
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      MINUTKA_DB_PASSWORD: ${MINUTKA_DB_PASSWORD:?set MINUTKA_DB_PASSWORD in .env}
      MINUTKA_MIGRATOR_DB_PASSWORD: ${MINUTKA_MIGRATOR_DB_PASSWORD:?set MINUTKA_MIGRATOR_DB_PASSWORD in .env}
    volumes:
      - minutka-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-minutka-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  # An explicit stable name preserves data if the Compose project name changes.
  minutka-postgres-data:
    name: minutka-postgres-data
  minutka-minio-data:
    name: minutka-minio-data
