# Стек унаследован от репозитория ассистента как шаблон и НЕ переиспользует его
# секреты: bundle `secrets/assistant.yaml` и recipient production-хоста ассистента
# сняты при клонировании. До первого деплоя «Минутки» здесь должен появиться
# recipient её собственного хоста, а bundle — создан заново по `secrets/README.md`.
keys:
  # Local owner key. The private key lives in ~/.config/sops/age/keys.txt.
  - &owner age13fvzv36jr0t29s9wvc84ydgn8vrc3cw2takk500ecjedzxjnr5msac2tqd
  # Derived from the Minutka production host's ssh-ed25519 host public key.
  # Placeholder: sops fails loudly until the real recipient is filled in.
  - &server age1REPLACE_WITH_MINUTKA_HOST_RECIPIENT

creation_rules:
  - path_regex: secrets/assistant\.yaml$
    key_groups:
      - age:
          - *owner
          - *server
